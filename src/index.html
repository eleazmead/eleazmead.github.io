<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!--
      Static fallback SEO tags below.

      This is a client-rendered Angular SPA with no server-side rendering, and
      SeoService (src/app/shared/seo.service.ts) updates these tags dynamically
      once the app boots. However, social link-preview crawlers (WhatsApp,
      Facebook, X/Twitter, iMessage, Slack) do NOT execute JavaScript - they
      only read this raw HTML. So the English defaults below must be kept in
      sync by hand with public/i18n/en.json ("seo" and "couple" keys) and
      src/app/config/app.config.ts ("seo" block) whenever wedding details,
      the site URL, or the OG image change. The hreflang and og:locale:alternate
      tags must also list every locale in APP_CONFIG.i18n.supportedLocales.
    -->
    <title>Eleaz &amp; Mead - Wedding on 16 January 2027, Saturday</title>
    <meta
      name="description"
      content="Eleaz &amp; Mead are getting married on 16 January 2027, Saturday in Singapore. Find our wedding details, RSVP, and more."
    />
    <meta
      name="keywords"
      content="Eleaz and Mead wedding, Eleaz Mead wedding Singapore, wedding RSVP"
    />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://eleazmead.com/" />
    <link rel="alternate" hreflang="en" href="https://eleazmead.com/" />
    <link rel="alternate" hreflang="fil" href="https://eleazmead.com/" />
    <link rel="alternate" hreflang="zh-Hans-SG" href="https://eleazmead.com/" />
    <link rel="alternate" hreflang="x-default" href="https://eleazmead.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eleaz &amp; Mead" />
    <meta property="og:title" content="Eleaz &amp; Mead - Wedding on 16 January 2027, Saturday" />
    <meta
      property="og:description"
      content="Eleaz &amp; Mead are getting married on 16 January 2027, Saturday in Singapore. Find our wedding details, RSVP, and more."
    />
    <meta property="og:url" content="https://eleazmead.com/" />
    <meta property="og:image" content="https://eleazmead.com/og-image.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fil_PH" />
    <meta property="og:locale:alternate" content="zh_SG" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eleaz &amp; Mead - Wedding on 16 January 2027, Saturday" />
    <meta
      name="twitter:description"
      content="Eleaz &amp; Mead are getting married on 16 January 2027, Saturday in Singapore. Find our wedding details, RSVP, and more."
    />
    <meta name="twitter:image" content="https://eleazmead.com/og-image.jpg" />

    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://script.google.com" />
    <link rel="preconnect" href="https://script.googleusercontent.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="gas-url" content="REPLACE_GAS_WEB_APP_URL" />
    <script>
      (function () {
        var meta = document.querySelector('meta[name="gas-url"]');
        var url = meta && meta.getAttribute('content');
        if (!url || url.indexOf('https://') !== 0) return;
        var hash = window.location.pathname.replace(/^\//, '').trim();
        if (!hash || hash === 'admin') return;
        window.__guestPrefetch__ = fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: 'getGuestByHash', hash: hash }),
        })
          .then(function (r) { return r.json(); })
          .catch(function () { return null; });
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

<!--END-->
