<section class="made-with-love">
  <div class="made-with-love__stage">
    <img
      class="made-with-love__frame"
      [src]="eleazImageUrl"
      alt="Eleaz animated illustration"
      aria-hidden="true"
    />
    <p class="made-with-love__text">{{ 'footer.message' | translate }}</p>
    <img
      class="made-with-love__frame"
      [src]="meadImageUrl"
      alt="Mead animated illustration"
      aria-hidden="true"
    />
  </div>
</section>
